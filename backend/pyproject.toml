[project]
name = "realtime-rag-lakehouse"
version = "0.1.0"
description = "Serverless real-time data lakehouse with self-indexing RAG on AWS"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # AWS SDK
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    # Data processing
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    # Data validation
    "pydantic>=2.9.0",
    # RAG framework
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    # HTTP client (for API collectors)
    "httpx>=0.27.0",
    # Sentiment analysis (TextBlob for Gold layer enrichment)
    "textblob>=0.18.0",
    # Logging
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    # AWS mocking
    "moto[s3,dynamodb,stepfunctions,events,ssm]>=5.0.0",
    # Code quality
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    # Type stubs
    "boto3-stubs[s3,dynamodb,stepfunctions,events,ssm]>=1.35.0",
    "pandas-stubs>=2.2.0",
    # Pre-commit
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "-v",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
